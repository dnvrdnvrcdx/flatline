<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iOS Alert — Interactive Message</title>
<style>
  :root { color-scheme: dark; --blue:#007aff; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; }
  body {
    min-height:100svh; display:grid; place-items:center; overflow:hidden; color:#fff;
    background:
      radial-gradient(ellipse at 20% 18%, rgba(106,135,162,.55), transparent 40%),
      radial-gradient(ellipse at 80% 75%, rgba(92,101,126,.48), transparent 42%),
      linear-gradient(145deg,#18212d,#343d4a 48%,#10141c);
    padding:24px;
  }
  .wallpaper-glow { position:fixed; inset:-20%; pointer-events:none; background:radial-gradient(ellipse,rgba(255,255,255,.07),transparent 58%); filter:blur(22px); }
  .phone {
    position:relative; width:min(100%,390px); height:min(780px, calc(100svh - 40px));
    min-height:580px; border:1px solid rgba(255,255,255,.22); border-radius:42px;
    overflow:hidden; box-shadow:0 28px 90px rgba(0,0,0,.38);
    background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(0,0,0,.15));
    display:flex; flex-direction:column; isolation:isolate;
  }
  .status { height:54px; padding:16px 24px 0; display:flex; align-items:flex-start; justify-content:space-between; font-size:14px; font-weight:650; flex-shrink:0; }
  .status-icons { display:flex; gap:6px; align-items:center; }
  .signal { display:flex; align-items:end; gap:2px; height:14px; }
  .signal i { display:block; width:3px; border-radius:2px; background:white; }
  .signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px}
  .wifi { width:16px;height:12px;border-top:2px solid white;border-radius:50%; position:relative; transform:translateY(2px); }
  .wifi:after {content:"";position:absolute;left:4px;top:3px;width:7px;height:7px;border-top:2px solid white;border-radius:50%}
  .battery { font-size:11px; padding:3px 5px; border-radius:6px; background:#fff;color:#111; font-weight:750; }
  .screen-space { flex:1; display:grid; place-items:center; padding:22px; }
  .alert {
    width:100%; max-width:330px; border-radius:14px; overflow:hidden;
    background:rgba(250,250,252,.96); color:#111; text-align:center;
    box-shadow:0 12px 36px rgba(0,0,0,.23), 0 1px 1px rgba(255,255,255,.6) inset;
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    animation:appear .22s ease-out;
  }
  @keyframes appear { from { opacity:0; transform:scale(.97) translateY(5px) } to {opacity:1;transform:scale(1) translateY(0)} }
  .alert-content { padding:20px 20px 18px; }
  .alert-title { margin:0 0 8px; font-size:17px; line-height:1.25; font-weight:650; letter-spacing:-.25px; }
  .alert-message { margin:0; font-size:13px; line-height:1.45; font-weight:400; white-space:pre-line; }
  .actions { display:grid; grid-template-columns:1fr; border-top:1px solid rgba(60,60,67,.18); min-height:44px; }
  .actions.two { grid-template-columns:1fr 1fr; }
  button { appearance:none; border:0; background:transparent; color:var(--blue); font:500 17px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; min-height:44px; padding:12px 8px; cursor:pointer; }
  button + button { border-left:1px solid rgba(60,60,67,.18); }
  button:active { background:rgba(0,122,255,.09); }
  .footer { display:flex; justify-content:space-between; align-items:center; padding:0 24px 28px; color:rgba(255,255,255,.68); font-size:11px; }
  .home { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:116px;height:4px;border-radius:10px;background:rgba(255,255,255,.88); }
  .top-label { position:absolute; top:68px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:1.7px; text-transform:uppercase; color:rgba(255,255,255,.58); }
  .progress { position:absolute; top:94px; left:50%; transform:translateX(-50%); font-size:11px; color:rgba(255,255,255,.52); }
  @media (max-height:650px) { .phone{height:calc(100svh - 20px);min-height:0}.screen-space{padding:10px 18px}.alert-content{padding:16px}.footer{padding-bottom:22px}.top-label{top:58px}.progress{top:80px} }
  @media (prefers-reduced-motion: reduce) { .alert{animation:none} }
</style>
</head>
<body>
<div class="wallpaper-glow"></div>
<main class="phone" aria-label="Interactive iOS-style message alert">
  <div class="status">
    <span>9:41</span>
    <div class="status-icons" aria-hidden="true"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery">40</span></div>
  </div>
  <div class="top-label">A message for you</div>
  <div class="progress" id="progress">01 / 11</div>
  <section class="screen-space">
    <article class="alert" id="alert" aria-live="polite">
      <div class="alert-content">
        <h1 class="alert-title" id="title">Something went wrong.</h1>
        <p class="alert-message" id="message">Your message is waiting to be read.</p>
      </div>
      <div class="actions" id="actions">
        <button id="primary" type="button">Continue</button>
      </div>
    </article>
  </section>
  <div class="footer"><span>Interactive concept</span><span>Tap to continue →</span></div>
  <div class="home" aria-hidden="true"></div>
</main>
<script>
  // Original sample messages; replace the title/message strings to personalize.
  const alerts = [
    { title: "Something on your mind?", message: "There’s been a little distance lately.", buttons: ["Continue"] },
    { title: "Message not sent.", message: "Maybe the words are harder to say than they seem.", buttons: ["Not now", "Try again"] },
    { title: "Connection feels different.", message: "I miss when talking felt easy.", buttons: ["Continue"] },
    { title: "Request for clarity.", message: "I’d rather hear the truth than guess what changed.", buttons: ["I understand"] },
    { title: "Still listening.", message: "You can tell me what’s going on. I’ll listen.", buttons: ["Continue"] },
    { title: "Busy schedule detected.", message: "Life gets overwhelming, and time can slip away.", buttons: ["I know"] },
    { title: "A reminder.", message: "Being busy doesn’t always mean someone stopped caring.", buttons: ["Continue"] },
    { title: "Unsent message.", message: "Some things stay on the mind long after the day ends.", buttons: ["Keep going"] },
    { title: "No blame assigned.", message: "I just want to understand, not start another argument.", buttons: ["Continue"] },
    { title: "One last thing.", message: "Even in the quiet, the good memories still matter.", buttons: ["Continue"] },
    { title: "Message delivered.", message: "This was written with care. That’s all I wanted you to know.", buttons: ["Start over"] }
  ];
  let index = 0;
  const titleEl = document.getElementById("title");
  const messageEl = document.getElementById("message");
  const actionsEl = document.getElementById("actions");
  const alertEl = document.getElementById("alert");
  const progressEl = document.getElementById("progress");

  function render() {
    const item = alerts[index];
    titleEl.textContent = item.title;
    messageEl.textContent = item.message;
    progressEl.textContent = String(index + 1).padStart(2, "0") + " / " + String(alerts.length).padStart(2, "0");
    actionsEl.replaceChildren();
    actionsEl.className = "actions" + (item.buttons.length === 2 ? " two" : "");
    item.buttons.forEach((label, buttonIndex) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", () => {
        if (index === alerts.length - 1) index = 0;
        else index++;
        alertEl.style.animation = "none";
        void alertEl.offsetWidth;
        alertEl.style.animation = "";
        render();
      });
      actionsEl.appendChild(button);
    });
  }
  render();
</script>
</body>
</html>
